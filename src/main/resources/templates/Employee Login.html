<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <style>
        body {
            background-image:  url('/images/black.png');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #loginContainer {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center; /* Center align the form elements */
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
        }

         h2 {
            font-size: 18px; /* Reduced font size */
            font-weight: normal; /* Removed boldness */
            margin-top: 0;
            margin-bottom: 20px;
        }


        label {
            font-weight: bold;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 5px;
        }

        input[type="email"],
        input[type="password"],
        button {
            width: 100%;
            padding: 5px 10px;
            margin-bottom: 5px;
            border: none;
            border-bottom: 1px solid #ccc;
            box-sizing: border-box;
            outline: none;
        }

        button {
            background-color: steelblue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: royalblue;
        }

        p {
            margin-top: 10px;
            font-size: 14px;
        }

        p a {
            color: royalblue;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }

        .error {
            color: red;
            display: none;
        }
    </style>
</head>
<body>
<div id="loginContainer">
    <h1> Vehicle Requisition </h1>
    <h2>Welcome back</h2>
    <form id="loginForm">
        <!-- Email -->
        <label>
            <span style="margin-right: 5px;">📧</span>
            <input type="email" id="loginEmail" name="loginEmail" placeholder="Email" required>
        </label><br><br>

        <!-- Password -->
        <label>
            <span style="margin-right: 5px;">🔒</span>
            <input type="password" id="loginPassword" name="loginPassword" placeholder="Password" required>
        </label><br><br>

        <!-- Role -->
        <div class="role-select">
            <select id="loginRole" name="role">
                <option value="">Select Role</option>
                <option value="ADMINISTRATOR">👨‍💼 ADMINISTRATOR</option>
                <option value="HEAD_OF_DEPARTMENT">👩‍🏫 HEAD OF DEPARTMENT</option>
                <option value="DRIVER">🚗 DRIVER</option>
                <option value="HUMAN_RESOURCES">🏢 HUMAN RESOURCES</option>
            </select>
        </div><br><br>
        <button type="submit">Sign in</button>
        <p class="error" id="errorMessage" style="display: none;"></p>
    </form>
    <p> Don't have an account? <a href="/api/v1/employee/register">Sign up</a> </p>
    <p><a href="/api/v1/password/reset-page">Forgot password? </a> </p>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        // Capture form data
        let formData = {
            email: document.getElementById("loginEmail").value,
            password: document.getElementById("loginPassword").value,
            role: document.getElementById("loginRole").value
        };

        // Send login request to server
        fetch('http://localhost:8085/api/v1/employee/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json; charset=utf-8',
            },
            body: JSON.stringify(formData),
        })
        .then(response => {
            // Check for successful response
            if (response.ok) {
                return response.json();
            } else {
                // Handle non-200 status codes
                throw new Error('Sign in failed. Please check your credentials.');
            }
        })
        .then(data => {
            // Handle login response
            if (data && data.message === "Login Success") {
                alert("Sign in successful!");
                // redirect based on role
                 switch (formData.role) {
                    case "DRIVER":
                        window.location.href = "http://localhost:8085/api/v1/drivers/user-driver";
                        break;
                    case "HEAD_OF_DEPARTMENT":
                        window.location.href = "http://localhost:8085/api/v1/departments/department-page";
                        break;
                    case "HUMAN_RESOURCES":
                        window.location.href = "http://localhost:8085/api/v1/hr/hr-page";
                        break;
                    case "ADMINISTRATOR":
                        // Redirect to dashboard for admin
                        window.location.href = "http://localhost:8085/api/v1/admin/admin-page"; // You can add more admin-related pages here
                        break;
                    default:
                        alert("Invalid role selected");
                        break;
                }
            } else {
                // Handle unsuccessful login
                throw new Error(data.message || 'Sign in failed. Please check your credentials.');
            }
        })
        .catch(error => {
            // Log error and display error message
            console.error('Error:', error);
            document.getElementById('errorMessage').textContent = error.message;
            document.getElementById('errorMessage').style.display = 'block';
        });
    });
</script>

</body>
</html>
