<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Frontend</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: url('/images/black.png');
            background-size: cover;
            background-position: center;
            color: white;
        }

        h1 {
            text-align: center;
            color: white;
        }

        #buttonContainer {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            margin-top: 20px;
            text-align: center;
        }

        ul {
            list-style-type: none;
            padding: 0;
            text-align: center;
        }

        li {
            margin-bottom: 10px;
        }

        a {
            display: block;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<h1>Administrator</h1>

<div id="buttonContainer">
    <ul>
        <li><a href="#" onclick="redirectTo('http://localhost:8085/api/v1/employee/employee-login')">Login Page</a></li>
        <li><a href="#" onclick="redirectTo('http://localhost:8085/api/v1/drivers/user-driver')">Driver Page</a></li>
        <li><a href="#" onclick="redirectTo('http://localhost:8085/api/v1/departments/department-page')">Head Department Page</a></li>
        <li><a href="#" onclick="redirectTo('http://localhost:8085/api/v1/hr/hr-page')">Human Resources Page</a></li>
        <li><a href="#" onclick="redirectTo('http://localhost:8085/api/v1/requisitionForms/anomaly')">Anomaly Page</a></li>
        <li><a href="#" onclick="logout()">Logout</a></li>
    </ul>
</div>

<script>
    function redirectTo(url) {
        window.location.href = url;
    }

    function logout() {
        window.location.href = 'http://localhost:8085/api/v1/employee/employee-login';
    }
</script>

</body>
</html>
