<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <style>
        body {
            background-image: url('/images/black.jpeg');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            width: 400px; /* Increased width for better layout */
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"],
        button {
            width: 100%;
            padding: 5px 10px; /* Adjusted padding for better spacing */
            margin-bottom: 5px; /* Increased margin for better separation */
            border: none;
            border-bottom: 1px solid #ccc;
            box-sizing: border-box;
            outline: none;
        }

        button {
            background-color: steelblue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: royalblue;
        }

        #message {
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8"> <!-- Adjusted column size for better layout -->
            <h2 class="mb-3">Change Password</h2>
            <!-- Change Password Form -->
            <form id="changeForm">
                <div class="form-group">
                    <label for="token">Enter token received in Email:</label>
                    <input type="text" class="form-control" id="token" name="token" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">Enter new password:</label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Change Password</button>
            </form>
            <div id="message" class="mt-3"></div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('#changeForm').submit(function(event) {
            event.preventDefault();
            var token = $('#token').val();
            var newPassword = $('#newPassword').val();
            $.ajax({
                type: 'POST',
                url: 'http://localhost:8085/api/v1/password/change',
                data: { token: token, newPassword: newPassword },
                success: function(response) {
                    $('#message').html('<div class="alert alert-success">' + response.message + '</div>');
                    $('#token').val('');
                    $('#newPassword').val('');
                    setTimeout(function() {
                        window.location.href = 'http://localhost:8085/api/v1/employee/employee-login';
                    }, 2000); // 2-second delay before redirecting
                },
                error: function(xhr, status, error) {
                    var errorMessage = JSON.parse(xhr.responseText).message;
                    $('#message').html('<div class="alert alert-danger">' + errorMessage + '</div>');
                }
            });
        });
    });
</script>
</body>
</html>
